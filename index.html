<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הדפים של לרני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 4 L58 42 L96 50 L58 58 L50 96 L42 58 L4 50 L42 42 Z' fill='%239b7ed8'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f7f8fc; --surface:#fff; --text:#1e293b; --soft:#64748b; --line:#e4e8f0; --primary:#00b4d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161f; --surface:#1a2230; --text:#e8edf5; --soft:#9aa8bc; --line:#2a3547; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Heebo','Segoe UI',sans-serif; min-height:100vh; display:grid; place-items:center; padding:24px; }
  main { max-width:520px; width:100%; text-align:center; }
  h1 { font-weight:900; font-size:2rem; margin:12px 0 6px; }
  h1 span { color:var(--primary); }
  .sub { color:var(--soft); margin:0 0 32px; }
  a.card {
    display:block; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:18px 22px; text-decoration:none; color:var(--text);
    text-align:right; transition:transform .2s ease; margin-bottom:12px;
  }
  a.card:hover { transform:translateY(-2px); }
  a.card b { display:block; font-size:1.05rem; }
  a.card small { color:var(--soft); }
</style>
</head>
<body>
<main>
  <svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L58 42 L96 50 L58 58 L50 96 L42 58 L4 50 L42 42 Z" fill="#9b7ed8"/></svg>
  <h1>הדפים של <span>לרני</span></h1>
  <p class="sub">חינוך · בינה מלאכותית · הגשמת חלומות</p>
  <a class="card" href="social-kit/">
    <b>ערכת הסושיאל ✨</b>
    <small>שפה ויזואלית אחידה לפוסטים — צבעים, טיפוגרפיה וחמש תבניות</small>
  </a>
</main>
</body>
</html>
