<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>לרני — Gemini</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;600;700;800&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="post.css">
<style>
  .blob.b1 { width: 620px; height: 620px; background: #7babd4; opacity: .24; top: -150px; right: -120px; }
  .blob.b2 { width: 520px; height: 520px; background: #7dd4ac; opacity: .22; bottom: -130px; left: -110px; }
  .body { position: absolute; top: 260px; right: 90px; left: 90px; z-index: 10; }
  .kicker { font-size: 32px; font-weight: 600; color: #4a6a8a; margin-bottom: 18px; }
  .title { font-size: 68px; }
  .title .pop { color: #f97316; }
  .clock-card {
    margin-top: 44px;
    background: rgba(255,255,255,.78);
    border-radius: 24px;
    border-right: 7px solid #7dd4ac;
    box-shadow: 0 10px 34px rgba(30,58,95,.11);
    padding: 28px 34px;
    display: inline-flex; align-items: center; gap: 20px;
    transform: rotate(-1.2deg);
    font-size: 31px; font-weight: 600; color: #1e3a5f;
  }
  .clock-card .big { font-family: 'Playpen Sans Hebrew', cursive; font-size: 52px; font-weight: 800; color: #3a8a64; }
  .cta-row { position: absolute; bottom: 150px; right: 90px; z-index: 10; }
</style>
</head>
<body>
<div class="post">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <span class="pill">הדרכה באתר</span>

  <div class="body">
    <div class="kicker">כמה זמן לוקח לכם להכין מצגת?</div>
    <div class="title">מצגת שלמה עם <span class="pop">Gemini</span> — כולל תמונות ותרגול</div>
    <div class="clock-card"><span class="big">5</span> דקות. מהרעיון ועד השקף האחרון.</div>
  </div>

  <div class="cta-row"><span class="cta-chip">הדרכה חינמית · צעד אחר צעד · באתר ←</span></div>

  <div class="footer">
    <svg class="circles" viewBox="0 0 40 40"><circle cx="15" cy="20" r="12" fill="#7babd4" opacity=".7"/><circle cx="25" cy="20" r="12" fill="#7dd4ac" opacity=".7"/></svg>
    <span class="name">Learni</span>
    <span class="url">learni.ai</span>
  </div>
</div>
</body>
</html>
